[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opspilot"
version = "0.1.0"
description = "Production-grade RAG assistant for LLM deployment troubleshooting"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "YEYEPrincess" }
]
dependencies = [
  "beautifulsoup4>=4.15.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pdfplumber>=0.11.10",
  "pydantic-settings>=2.6,<3.0",
  "pypdf>=6.15.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "ingestion", "retrieval", "generation", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

